<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Claudebox{% endblock %} · Claudebox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Nootka Saunas palette — dark console skin (Coastal Water + Evergreen, Heat accent) */
      --nootka-steam:#CDD8DA; --nootka-coastal-water:#073D44;
      --nootka-reindeer-moss:#919A3C; --nootka-evergreen:#324126; --nootka-heat:#FF821B;

      --bg:var(--nootka-coastal-water); --panel:var(--nootka-evergreen); --card:var(--nootka-evergreen);
      --raised:color-mix(in srgb, var(--nootka-evergreen), white 9%);
      --fg:var(--nootka-steam);
      --muted:color-mix(in srgb, var(--nootka-steam), transparent 32%);
      --faint:color-mix(in srgb, var(--nootka-steam), transparent 58%);
      --line:color-mix(in srgb, var(--nootka-steam), transparent 86%);
      --line-soft:color-mix(in srgb, var(--nootka-steam), transparent 91%);
      --accent:var(--nootka-heat); --danger:#f26d6d;
      --add:var(--nootka-reindeer-moss); --del:#f26d6d;
      --font-sans:'DM Sans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --radius:10px;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body { margin:0; font:15px/1.55 var(--font-sans); color:var(--fg); background:var(--bg); -webkit-font-smoothing:antialiased; }
    code, .mono { font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:.9em; }

    header.top { display:flex; align-items:center; gap:.9rem; padding:.55rem 1.1rem; background:rgba(13,13,13,.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
    header.top a.brand { font-weight:600; letter-spacing:-.01em; text-decoration:none; color:var(--fg); font-size:1.02rem; }
    header.top .spacer { flex:1; }
    header.top a { color:var(--muted); text-decoration:none; transition:color .12s; }
    header.top a:hover { color:var(--fg); }

    main { max-width:1040px; margin:0 auto; padding:1.6rem 1.1rem 4rem; }
    a { color:var(--fg); text-decoration:none; }
    a:hover { text-decoration:underline; text-underline-offset:2px; }
    h1 { letter-spacing:-.02em; }

    .flash { background:color-mix(in srgb, var(--accent), transparent 90%); border:1px solid color-mix(in srgb, var(--accent), transparent 62%); padding:.6rem .9rem; border-radius:10px; margin-bottom:1rem; color:var(--fg); }
    .error { background:rgba(242,109,109,.08); border:1px solid rgba(242,109,109,.3); padding:.6rem .9rem; border-radius:10px; margin-bottom:1rem; color:var(--danger); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1.1rem 1.25rem; margin-bottom:1rem; }
    .muted { color:var(--muted); }

    button, .btn { font:inherit; font-size:.92rem; padding:.45rem .9rem; border:1px solid var(--line); border-radius:8px; background:var(--raised); cursor:pointer; text-decoration:none; color:var(--fg); display:inline-block; white-space:nowrap; transition:background .12s,border-color .12s,opacity .12s; }
    button:hover, .btn:hover { background:#262626; text-decoration:none; }
    button.primary { background:var(--accent); color:var(--nootka-evergreen); border-color:var(--accent); font-weight:700; }
    button.primary:hover { background:color-mix(in srgb, var(--accent), white 12%); }
    button.danger { background:transparent; color:var(--danger); border-color:rgba(242,109,109,.35); }
    button.danger:hover { background:rgba(242,109,109,.1); }
    button:disabled, .btn:disabled { opacity:.4; cursor:not-allowed; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    input[type=text], input[type=password] { font:inherit; padding:.55rem .7rem; border:1px solid var(--line); border-radius:8px; width:100%; background:var(--bg); color:var(--fg); }
    input::placeholder { color:var(--faint); }
    input:focus { border-color:#3a3a3a; outline:none; }
    select { font:inherit; padding:.4rem 1.6rem .4rem .6rem; border:1px solid var(--line); border-radius:8px; background:var(--raised); color:var(--fg); cursor:pointer; }

    table { border-collapse:collapse; width:100%; }
    th, td { text-align:left; padding:.6rem .75rem; border-bottom:1px solid var(--line-soft); }
    tr:last-child td { border-bottom:none; }
    thead th { font-size:.75rem; font-weight:500; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); }
    tbody tr { transition:background .1s; }
    tbody tr:hover { background:rgba(255,255,255,.02); }

    .tag { display:inline-block; font-size:.72rem; font-weight:500; padding:.14rem .55rem; border-radius:999px; border:1px solid var(--line); color:var(--muted); text-transform:lowercase; letter-spacing:.02em; }
    .tag.open { background:rgba(56,139,253,.13); border-color:rgba(56,139,253,.3); color:#6cb6ff; }
    .tag.pushed { background:rgba(63,185,80,.13); border-color:rgba(63,185,80,.3); color:#56d364; }
    .tag.closed { background:rgba(255,255,255,.04); border-color:var(--line); color:var(--faint); }

    nav.tabs { display:flex; gap:.15rem; margin:1.1rem 0 1.3rem; border-bottom:1px solid var(--line); }
    nav.tabs a { padding:.5rem .9rem; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
    nav.tabs a:hover { color:var(--fg); text-decoration:none; }
    nav.tabs a.active { color:var(--fg); border-bottom-color:var(--fg); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <main>
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
