{% extends "_shell.html" %}
{% block title %}{{ s.title }}{% endblock %}
{% block session_head %}
  <link rel="stylesheet" href="/static/xterm.css">
  <script src="/static/xterm.js"></script>
  <script src="/static/addon-fit.js"></script>
{% endblock %}

{% block dock_main %}
<div class="dock-term"><div id="terminal"></div></div>
<script>
(function () {
  const term = new Terminal({
    cursorBlink: true,
    fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
    fontSize: 13, lineHeight: 1.2,
    theme: {
      background: "#0d0d0d", foreground: "#ececec",
      cursor: "#10a37f", cursorAccent: "#0d0d0d",
      selectionBackground: "#2a3f57",
      black: "#1a1a1a", red: "#f26d6d", green: "#3fb950", yellow: "#d9a531",
      blue: "#6cb6ff", magenta: "#c497f0", cyan: "#4fd0c9", white: "#c9c9c9",
      brightBlack: "#6b6b6b", brightRed: "#ff8585", brightGreen: "#56d364",
      brightYellow: "#e3b341", brightBlue: "#8cc7ff", brightMagenta: "#d7b0f5",
      brightCyan: "#6ee0d8", brightWhite: "#ffffff"
    }
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("terminal"));
  fit.fit();

  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(proto + "://" + location.host + "/sessions/{{ s.id }}/terminal");
  ws.binaryType = "arraybuffer";

  function sendResize() {
    if (ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ resize: { cols: term.cols, rows: term.rows } }));
  }

  ws.onopen = () => { fit.fit(); sendResize(); term.focus(); };
  ws.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) term.write(new Uint8Array(ev.data));
    else term.write(ev.data);
  };
  ws.onclose = (ev) => term.write("\r\n\x1b[33m[disconnected" + (ev.reason ? ": " + ev.reason : "") + "]\x1b[0m\r\n");

  // Terminal input -> binary frames (so partial UTF-8 is fine).
  const enc = new TextEncoder();
  term.onData((d) => { if (ws.readyState === WebSocket.OPEN) ws.send(enc.encode(d)); });

  // Re-fit on ANY container size change (rail toggle, window resize, tab switch).
  // Debounced so the rail's .12s width animation doesn't spam tmux with SIGWINCH redraws.
  let rt;
  const ro = new ResizeObserver(() => {
    clearTimeout(rt);
    rt = setTimeout(() => { fit.fit(); sendResize(); }, 60);
  });
  ro.observe(document.getElementById("terminal"));
})();
</script>
{% endblock %}
